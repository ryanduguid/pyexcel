name: Synchronise Moban templates

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moban-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pyexcel/pyexcel-mobans
          ref: b95b0893e70834d9aefe7fab846f3967d1628186
          path: .moban.d/upstream/pyexcel
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: moremoban/pypi-mobans
          ref: 862f395a444d5123a75349c464efdb56ee5721f7
          path: .moban.d/upstream/pypi
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'
      - name: Prepare current Moban dependencies
        run: bash .github/moban-compat/prepare.sh
      - name: Check dependency compatibility
        run: python .github/moban-compat/test_compat.py
      - name: Check artifact validation
        run: python .github/moban-compat/test_workflow.py
      - name: Generate templates
        run: moban -f
      - name: Collect generated changes
        shell: bash
        run: |
          while IFS= read -r path; do
            if test -f "$path"; then git add -N -- "$path"; fi
          done < .github/moban-compat/outputs.txt
          git diff --binary HEAD --output="$RUNNER_TEMP/moban.patch" -- . ':!.moban.d/upstream'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: moban-changes
          path: ${{ runner.temp }}/moban.patch
          if-no-files-found: error
          retention-days: 7

  commit:
    needs: generate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: moban-changes
          path: ${{ runner.temp }}/moban-changes
      - name: Validate and commit metadata changes
        id: commit
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          TARGET_REF: ${{ github.ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          patch="$RUNNER_TEMP/moban-changes/moban.patch"
          test -f "$patch" && ! test -L "$patch"
          if ! test -s "$patch"; then exit 0; fi
          cp .github/moban-compat/outputs.txt "$RUNNER_TEMP/moban-outputs.txt"
          git apply --numstat -z "$patch" > "$RUNNER_TEMP/moban-paths"
          while IFS=$'\t' read -r -d '' _added _deleted path; do
            if ! grep -Fxq -- "$path" "$RUNNER_TEMP/moban-outputs.txt"; then
              echo 'Unexpected generated path'; exit 1
            fi
            case "$path" in
              .github/workflows/*) echo 'Review workflow changes in the moban-changes artifact'; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/moban-paths"
          git apply --check --index "$patch"
          git apply --index "$patch"
          while IFS= read -r -d '' path; do
            if ! grep -Fxq -- "$path" "$RUNNER_TEMP/moban-outputs.txt"; then
              echo 'Unexpected generated path'; exit 1
            fi
            case "$path" in
              .github/workflows/*) echo 'Review workflow changes in the moban-changes artifact'; exit 1 ;;
            esac
            test "$(git ls-files --stage -- "$path" | cut -d ' ' -f 1)" = 100644
          done < <(git diff --cached --name-only -z)
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git -c core.hooksPath=/dev/null -c user.name=github-actions\[bot\] \
            -c user.email=41898282+github-actions\[bot\]@users.noreply.github.com \
            commit -m 'Synchronise project metadata'
          echo 'committed=true' >> "$GITHUB_OUTPUT"
      - name: Push validated metadata commit
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ github.ref }}
        run: |
          git -c core.hooksPath=/dev/null -c credential.helper= \
            -c 'credential.helper=!gh auth git-credential' push origin "HEAD:$TARGET_REF"
